name: FFmpeg Windows wide build

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Start both builds together; each target installs its own binaries.
      max-parallel: 2
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            msystem: UCRT64
          - arch: x86
            runner: windows-2022
            msystem: MINGW32

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            diffutils
            pkgconf
            mingw-w64-${{ matrix.msystem == 'MINGW32' && 'i686' || 'ucrt-x86_64' }}-cc

      - name: Install available codec dependencies
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Package names follow MSYS2; packages missing from one architecture
          # are recorded in the artifact instead of pretending to be enabled.
          packages=(
            aom dav1d libx264 x265 libvpx libwebp libjxl openjpeg2
            opus lame fdk-aac libvorbis libtheora speex gsm opencore-amr
            libass freetype fontconfig fribidi harfbuzz
            libbluray libgme libmodplug libsoxr zimg vid.stab
            libxml2 zlib bzip2 libssh srt rtmpdump SDL2
            xvidcore liblc3 rav1e svt-av1 libplacebo librsvg
            libvpl vulkan vulkan-headers libzvbi
          )
          packages+=(nasm ffnvcodec-headers amf-headers)
          packages+=(
            aribb24 libaribcaption libbs2b libcaca libcdio
            dvdnav dvdread libmysofa qrencode quirc snappy
            zeromq shine twolame rubberband librist codec2
            openh264 vmaf vvenc kvazaar xavs2 libdavs2 oapv
          )
          if [[ "$BUILD_ARCH" == x64 ]]; then
            # Larger Windows-only toolkit and extra experimental codecs.
            packages+=(svt-jpeg-xs frei0r-plugins)
          fi
          : > missing-packages.txt
          available=()
          for name in "${packages[@]}"; do
            package="${MINGW_PACKAGE_PREFIX}-${name}"
            if pacman -Si "$package" >/dev/null 2>&1; then
              available+=("$package")
            else
              echo "$package" >> missing-packages.txt
            fi
          done
          # Resolve and download the architecture's entire available set in
          # one pacman transaction before starting the compiler.
          pacman --noconfirm --needed -S "${available[@]}"
          if [[ "$BUILD_ARCH" == x64 ]]; then
            # The primary build must never silently lose its main codecs.
            required=(libx264 x265 libvpx aom dav1d opus lame fdk-aac)
          else
            required=(libx264 x265 opus)
          fi
          for name in "${required[@]}"; do
            pacman -Q "${MINGW_PACKAGE_PREFIX}-${name}" >/dev/null || {
              echo "${BUILD_ARCH} required package unavailable: $name" >&2
              exit 1
            }
          done

      - name: Configure and compile this checkout
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p build dist
          cd build
          flags=(
            --prefix=/usr/local
            --target-os=mingw32
            --enable-gpl
            --enable-version3
            --enable-nonfree
            --disable-debug
            --disable-doc
            --enable-static
            --disable-shared
            --enable-ffmpeg
            --enable-ffprobe
          )
          # All built-in decoders, encoders, muxers and filters stay enabled.
          # Optional libraries are enabled only when their MSYS2 package exists.
          optional=(
            'aom:libaom' 'dav1d:libdav1d' 'libx264:libx264'
            'x265:libx265' 'libvpx:libvpx' 'libwebp:libwebp'
            'libjxl:libjxl' 'openjpeg2:libopenjpeg'
            'opus:libopus' 'lame:libmp3lame'
            'fdk-aac:libfdk-aac'
            'libvorbis:libvorbis' 'libtheora:libtheora'
            'speex:libspeex' 'gsm:libgsm'
            'opencore-amr:libopencore-amrnb,libopencore-amrwb'
            'libass:libass' 'freetype:libfreetype'
            'fontconfig:libfontconfig' 'fribidi:libfribidi'
            'harfbuzz:libharfbuzz' 'libbluray:libbluray'
            'libgme:libgme' 'libmodplug:libmodplug'
            'libsoxr:libsoxr' 'zimg:libzimg' 'vid.stab:libvidstab'
            'libxml2:libxml2' 'libssh:libssh' 'srt:libsrt'
            'rtmpdump:librtmp' 'xvidcore:libxvid'
            'liblc3:liblc3' 'rav1e:librav1e'
            'svt-av1:libsvtav1' 'libplacebo:libplacebo'
            'librsvg:librsvg' 'libvpl:libvpl'
            'libzvbi:libzvbi'
          )
          optional+=(
            'aribb24:libaribb24' 'libaribcaption:libaribcaption'
            'libbs2b:libbs2b' 'libcaca:libcaca'
            'libcdio:libcdio' 'dvdnav:libdvdnav'
            'dvdread:libdvdread' 'libmysofa:libmysofa'
            'qrencode:libqrencode' 'quirc:libquirc'
            'snappy:libsnappy' 'zeromq:libzmq'
            'shine:libshine' 'twolame:libtwolame'
            'rubberband:librubberband' 'librist:librist'
            'codec2:libcodec2' 'openh264:libopenh264'
            'vmaf:libvmaf' 'vvenc:libvvenc'
            'kvazaar:libkvazaar' 'xavs2:libxavs2'
            'libdavs2:libdavs2' 'oapv:liboapv'
          )
          if [[ "$BUILD_ARCH" == x64 ]]; then
            optional+=(
              'svt-jpeg-xs:libsvtjpegxs'
              'frei0r-plugins:frei0r'
            )
          fi
          configure_help=$(../configure --help)
          : > ../dist/unavailable-options.txt
          for item in "${optional[@]}"; do
            package=${item%%:*}
            option_list=${item#*:}
            if pacman -Q "${MINGW_PACKAGE_PREFIX}-${package}" >/dev/null 2>&1; then
              IFS=, read -ra options <<< "$option_list"
              for option in "${options[@]}"; do
                if [[ "$option" == libsvtjpegxs ]] \
                   && ! pkg-config --exists 'SvtJpegxs >= 0.10.0'; then
                  installed=$(pkg-config --modversion SvtJpegxs 2>/dev/null || echo unknown)
                  echo "Incompatible package: SvtJpegxs ${installed}; FFmpeg needs >= 0.10.0" >> ../dist/unavailable-options.txt
                  continue
                fi
                if grep -Fq -- "--enable-${option} " <<< "$configure_help"; then
                  flags+=("--enable-${option}")
                else
                  echo "Unsupported by this FFmpeg checkout: --enable-${option}" >> ../dist/unavailable-options.txt
                fi
              done
            else
              echo "Missing package: ${MINGW_PACKAGE_PREFIX}-${package} (${option_list})" >> ../dist/unavailable-options.txt
            fi
          done
          for feature in 'ffnvcodec-headers:nvenc' 'amf-headers:amf'; do
            header_package=${feature%%:*}
            option=${feature#*:}
            if pacman -Q "${MINGW_PACKAGE_PREFIX}-${header_package}" >/dev/null 2>&1 \
               && grep -Fq -- "--enable-${option} " <<< "$configure_help"; then
              flags+=("--enable-${option}")
            fi
          done
          if pacman -Q "${MINGW_PACKAGE_PREFIX}-SDL2" >/dev/null 2>&1; then
            : # FFplay is enabled by default when SDL2 is present.
          else
            flags+=(--disable-ffplay)
          fi
          if [[ "$BUILD_ARCH" == x86 ]]; then
            flags+=(--arch=x86)
          else
            flags+=(--arch=x86_64)
          fi
          printf '%s\n' "${flags[@]}" > ../dist/configure-options.txt
          if ! ../configure "${flags[@]}"; then
            cp ffbuild/config.log ../dist/config.log 2>/dev/null || true
            exit 1
          fi
          cp ffbuild/config.log ../dist/config.log
          make -j2
          cp ffmpeg.exe ffprobe.exe ../dist/
          if [[ -f ffplay.exe ]]; then cp ffplay.exe ../dist/; fi
          cp ../LICENSE.md ../dist/ 2>/dev/null || true
          cp ../COPYING.GPLv3 ../dist/ 2>/dev/null || true
          cp ../missing-packages.txt ../dist/

      - name: Bundle runtime DLLs and check features
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # A static FFmpeg link may still depend on MSYS2 runtime DLLs.
          # Include all DLLs from this architecture to avoid missing transitive
          # dependencies on a clean Windows installation.
          cp "$MINGW_PREFIX"/bin/*.dll dist/
          dist/ffmpeg.exe -hide_banner -version > dist/version.txt
          dist/ffmpeg.exe -hide_banner -encoders > dist/encoders.txt
          dist/ffmpeg.exe -hide_banner -decoders > dist/decoders.txt
          dist/ffmpeg.exe -hide_banner -filters > dist/filters.txt
          dist/ffmpeg.exe -hide_banner -protocols > dist/protocols.txt
          dist/ffmpeg.exe -hide_banner -buildconf > dist/buildconf.txt
          if [[ "$BUILD_ARCH" == x64 ]]; then
            required_encoders=(libx264 libx265 libvpx_vp9 libaom-av1 libopus libfdk_aac)
          elif [[ "$BUILD_ARCH" == x86 ]]; then
            required_encoders=(libx264 libx265 libopus)
          fi
          for encoder in "${required_encoders[@]}"; do
            if ! awk -v name="$encoder" '$2 == name { found=1 } END { exit !found }' dist/encoders.txt; then
              echo "Required encoder missing: $encoder" >&2
              exit 1
            fi
          done
          dist/ffprobe.exe -version > /dev/null

      - uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-windows-${{ matrix.arch }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload configuration log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            build/ffbuild/config.log
            dist/*.txt
            missing-packages.txt
          if-no-files-found: ignore
