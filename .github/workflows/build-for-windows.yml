name: FFmpeg Windows x64 and x86

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { arch: x64, msystem: UCRT64, prefix: ucrt-x86_64 }
          - { arch: x86, msystem: MINGW32, prefix: i686 }

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make git diffutils pkgconf
            mingw-w64-${{ matrix.prefix }}-cc
            mingw-w64-${{ matrix.prefix }}-binutils

      - name: Install available Windows libraries
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist dist-static dist-shared
          # All names are MSYS2 package suffixes. Some optional packages
          # exist only for one architecture; record these gaps.
          packages=(
            nasm SDL2 libx264 x265 aom dav1d libvpx svt-av1
            fdk-aac opus lame libvorbis libtheora speex gsm
            opencore-amr openh264 openjpeg2 libjxl libwebp xvidcore
            libass freetype fontconfig fribidi harfbuzz zimg
            libsoxr libbluray libgme libmodplug liblc3
            rubberband vid.stab vmaf libplacebo librsvg
            libxml2 zlib bzip2 srt libssh rtmpdump
            libzvbi codec2 twolame shine librist
            aribb24 libaribcaption libbs2b libcaca
            libcdio libcdio-paranoia libmysofa qrencode quirc
            snappy zeromq vvenc kvazaar xavs2 libdavs2 oapv
            libvpl vulkan vulkan-headers ffnvcodec-headers amf-headers
          )
          if [[ "$BUILD_ARCH" == x64 ]]; then
            packages+=(frei0r-plugins svt-jpeg-xs rav1e)
          fi
          available=()
          : > dist/missing-packages.txt
          for name in "${packages[@]}"; do
            pkg="${MINGW_PACKAGE_PREFIX}-${name}"
            if pacman -Si "$pkg" >/dev/null 2>&1; then
              available+=("$pkg")
            else
              echo "$pkg" >> dist/missing-packages.txt
            fi
          done
          # Package metadata and mirrors can disagree during MSYS2 repo updates.
          # If one package disappears, install the rest independently so an
          # optional x86 codec does not cancel the entire transaction.
          if ! pacman --noconfirm --needed -S "${available[@]}"; then
            echo 'Batch install failed; retrying packages individually' >&2
            for pkg in "${available[@]}"; do
              if ! pacman --noconfirm --needed -S "$pkg"; then
                echo "$pkg: unavailable during install" >> dist/missing-packages.txt
              fi
            done
          fi
          # Core codecs and FFplay have to be present before a long build.
          if [[ "$BUILD_ARCH" == x64 ]]; then
            core_packages=(libx264 x265 libvpx aom opus fdk-aac SDL2)
          else
            core_packages=(opus SDL2)
          fi
          for name in "${core_packages[@]}"; do
            pacman -Q "${MINGW_PACKAGE_PREFIX}-${name}" >/dev/null || {
              echo "Missing required ${BUILD_ARCH} dependency: ${name}" >&2
              exit 1
            }
          done

      - name: Build x86 x264 when its MSYS2 library is unavailable
        if: matrix.arch == 'x86'
        run: |
          set -euo pipefail
          if pkg-config --exists x264; then
            echo "Using MSYS2 libx264 $(pkg-config --modversion x264)"
            exit 0
          fi
          if ! git clone --depth 1 https://code.videolan.org/videolan/x264.git x264-src; then
            rm -rf x264-src
            git clone --depth 1 https://github.com/mirror/x264.git x264-src
          fi
          cd x264-src
          ./configure --host=i686-w64-mingw32 --prefix="$MINGW_PREFIX" \
            --enable-static --disable-cli --disable-opencl
          make -j2
          make install
          pkg-config --exists x264
          echo "x264 source commit: $(git rev-parse HEAD)" > ../dist/x264-source.txt
          sed -i "/^${MINGW_PACKAGE_PREFIX}-libx264$/d" ../dist/missing-packages.txt

      - name: Select and configure codecs
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p build-static
          cd build-static
          help_text=$(../configure --help)
          base=(
            --target-os=mingw32 --enable-gpl --enable-version3
            --enable-nonfree --disable-debug --disable-doc
          )
          if [[ "$BUILD_ARCH" == x86 ]]; then
            base+=(--arch=x86)
            core=(--enable-libx264 --enable-libopus)
          else
            base+=(--arch=x86_64)
            core=(
              --enable-libx264 --enable-libx265 --enable-libvpx
              --enable-libaom --enable-libopus --enable-libfdk-aac
            )
          fi
          for option in "${core[@]}"; do
            grep -Fq -- "$option " <<< "$help_text" || {
              echo "FFmpeg checkout lacks required option: $option" >&2
              exit 1
            }
          done
          # Mapping is package suffix : FFmpeg configure feature.
          optional_map=(
            'x265:libx265' 'libvpx:libvpx' 'aom:libaom'
            'dav1d:libdav1d' 'svt-av1:libsvtav1'
            'fdk-aac:libfdk-aac' 'opus:libopus' 'lame:libmp3lame'
            'libvorbis:libvorbis' 'libtheora:libtheora'
            'speex:libspeex' 'gsm:libgsm'
            'opencore-amr:libopencore-amrnb,libopencore-amrwb'
            'openh264:libopenh264' 'openjpeg2:libopenjpeg'
            'libjxl:libjxl' 'libwebp:libwebp' 'xvidcore:libxvid'
            'libass:libass' 'freetype:libfreetype'
            'fontconfig:libfontconfig' 'fribidi:libfribidi'
            'harfbuzz:libharfbuzz' 'zimg:libzimg'
            'libsoxr:libsoxr' 'libbluray:libbluray'
            'libgme:libgme' 'libmodplug:libmodplug'
            'liblc3:liblc3' 'rubberband:librubberband'
            'vid.stab:libvidstab' 'vmaf:libvmaf'
            'libplacebo:libplacebo' 'librsvg:librsvg'
            'libxml2:libxml2' 'srt:libsrt' 'libssh:libssh'
            'rtmpdump:librtmp' 'libzvbi:libzvbi'
            'codec2:libcodec2' 'twolame:libtwolame'
            'shine:libshine' 'librist:librist'
            'aribb24:libaribb24' 'libaribcaption:libaribcaption'
            'libbs2b:libbs2b' 'libcaca:libcaca'
            'libcdio:libcdio' 'libmysofa:libmysofa'
            'qrencode:libqrencode' 'quirc:libquirc'
            'snappy:libsnappy' 'zeromq:libzmq'
            'vvenc:libvvenc' 'kvazaar:libkvazaar'
            'xavs2:libxavs2' 'libdavs2:libdavs2' 'oapv:liboapv'
          )
          if [[ "$BUILD_ARCH" == x64 ]]; then
            optional_map+=(
              'rav1e:librav1e' 'frei0r-plugins:frei0r'
              'svt-jpeg-xs:libsvtjpegxs'
            )
          fi
          optional=()
          : > ../dist/skipped-options.txt
          for mapping in "${optional_map[@]}"; do
            package=${mapping%%:*}
            IFS=, read -ra features <<< "${mapping#*:}"
            for feature in "${features[@]}"; do
              option="--enable-${feature}"
              if ! grep -Fq -- "$option " <<< "$help_text"; then
                echo "$option: unsupported by this FFmpeg checkout" >> ../dist/skipped-options.txt
              elif ! pacman -Q "${MINGW_PACKAGE_PREFIX}-${package}" >/dev/null 2>&1; then
                echo "$option: MSYS2 package ${package} unavailable" >> ../dist/skipped-options.txt
              elif [[ " ${core[*]} " == *" $option "* ]]; then
                : # Already mandatory.
              elif [[ "$feature" == libcdio ]] \
                   && ! pkg-config --exists libcdio_cdda libcdio_paranoia; then
                echo "$option: libcdio-paranoia development files missing" >> ../dist/skipped-options.txt
              elif [[ "$feature" == libsvtjpegxs ]] \
                   && ! pkg-config --exists 'SvtJpegxs >= 0.10.0'; then
                echo "$option: SvtJpegxs >= 0.10.0 required" >> ../dist/skipped-options.txt
              else
                optional+=("$option")
              fi
            done
          done
          for feature in 'ffnvcodec-headers:nvenc' 'amf-headers:amf'; do
            package=${feature%%:*}
            option="--enable-${feature#*:}"
            if pacman -Q "${MINGW_PACKAGE_PREFIX}-${package}" >/dev/null 2>&1 \
               && grep -Fq -- "$option " <<< "$help_text"; then
              optional+=("$option")
            fi
          done
          # FFmpeg's external-library probes catch incompatible APIs as well
          # as missing .pc files. Retry only the optional feature named in
          # the first failure; core codecs are never removed.
          # Separate object trees are required: configure and object files for
          # static FFmpeg libraries must never be reused for shared DLLs.
          cd ..
          for variant in static shared; do
            mkdir -p "build-${variant}"
            cd "build-${variant}"
            if [[ "$variant" == static ]]; then
              mode=(--enable-static --disable-shared --pkg-config-flags=--static)
            else
              mode=(--enable-shared --disable-static)
            fi
            selected=("${optional[@]}")
            configured=false
            for attempt in $(seq 1 20); do
              flags=("${base[@]}" "${mode[@]}" "${core[@]}" "${selected[@]}")
              printf '%s\n' "${flags[@]}" > "../dist-${variant}/configure-options.txt"
              if ../configure "${flags[@]}" > "../dist-${variant}/configure-attempt-${attempt}.txt" 2>&1; then
                configured=true
                break
              fi
              error=$(grep -E '^ERROR:|^Unknown option' "../dist-${variant}/configure-attempt-${attempt}.txt" | tail -1 || true)
              [[ -n "$error" ]] || { cat "../dist-${variant}/configure-attempt-${attempt}.txt"; exit 1; }
              echo "${variant}: $error" >&2
              normalized=${error,,}
              normalized=${normalized//-/_}
              drop=
              for option in "${selected[@]}"; do
                name=${option#--enable-}
                name=${name//-/_}
                alias=${name#lib}
                if [[ "$normalized" == *"$name"* ]] \
                   || [[ ${#alias} -ge 5 && "$normalized" == *"$alias"* ]]; then
                  drop=$option
                  break
                fi
              done
              [[ -n "$drop" ]] || { cat "../dist-${variant}/configure-attempt-${attempt}.txt"; exit 1; }
              echo "$drop: $error" >> ../dist/skipped-options.txt
              next=()
              for option in "${selected[@]}"; do
                [[ "$option" == "$drop" ]] || next+=("$option")
              done
              selected=("${next[@]}")
            done
            [[ "$configured" == true ]] || { echo "${variant} configuration retries exhausted" >&2; exit 1; }
            cp ffbuild/config.log "../dist-${variant}/config.log"
            cat "../dist-${variant}"/configure-attempt-*.txt > "../dist-${variant}/configure-history.txt"
            cp ../dist/missing-packages.txt ../dist/skipped-options.txt "../dist-${variant}/"
            cd ..
          done

      - name: Compile, package and verify both variants
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for variant in static shared; do
            build="build-${variant}"
            output="dist-${variant}"
            if ! make -C "$build" -j2 > "$output/build.log" 2>&1; then
              tail -100 "$output/build.log"
              exit 1
            fi
            cp "$build/ffmpeg.exe" "$build/ffprobe.exe" "$build/ffplay.exe" "$output/"
            if [[ "$variant" == shared ]]; then
              # The FFmpeg-built avcodec/avformat/etc. DLLs are part of the
              # dynamic build and must travel with its executables.
              while IFS= read -r -d '' dll; do
                cp "$dll" "$output/"
              done < <(find "$build" -maxdepth 2 -type f -iname '*.dll' -print0)
              compgen -G "$output/*.dll" >/dev/null || {
                echo 'Shared build produced no FFmpeg DLLs' >&2
                exit 1
              }
            fi
            # Copy the external runtime DLL closure for this architecture,
            # rather than every unrelated DLL installed in MSYS2.
            declare -A installed=() seen=()
            for dll in "$MINGW_PREFIX"/bin/*.dll; do
              key=${dll##*/}
              installed["${key,,}"]="$dll"
            done
            queue=("$output"/*.exe "$output"/*.dll)
            for ((i=0; i<${#queue[@]}; i++)); do
              file=${queue[i]}
              [[ -f "$file" ]] || continue
              while IFS= read -r dep; do
                [[ -n "$dep" ]] || continue
                key=${dep,,}
                [[ -z "${seen[$key]:-}" ]] || continue
                seen[$key]=1
                [[ -f "$output/$dep" ]] && continue
                source=${installed[$key]:-}
                if [[ -n "$source" ]]; then
                  cp "$source" "$output/"
                  queue+=("$output/$dep")
                else
                  printf '%s (imported by %s)\n' "$dep" "${file##*/}" >> "$output/system-or-missing-dlls.txt"
                fi
              done < <(objdump -p "$file" | awk '/DLL Name:/ { print $3 }')
            done
            unset installed seen
            # Test with the MinGW bin directory removed from PATH: running on
            # the runner must not accidentally hide a missing packaged DLL.
            (
              cd "$output"
              export PATH=/usr/bin:/c/Windows/System32:/c/Windows
              ./ffmpeg.exe -hide_banner -version > version.txt
              ./ffmpeg.exe -hide_banner -buildconf > buildconf.txt
              ./ffmpeg.exe -hide_banner -encoders > encoders.txt
              ./ffmpeg.exe -hide_banner -decoders > decoders.txt
              ./ffmpeg.exe -hide_banner -filters > filters.txt
              ./ffprobe.exe -version > /dev/null
              ./ffplay.exe -version > /dev/null
              if [[ "$BUILD_ARCH" == x64 ]]; then
                required=(libx264 libx265 libvpx-vp9 libaom-av1 libopus libfdk_aac aac)
              else
                required=(libx264 libopus aac)
              fi
              for name in "${required[@]}"; do
                awk -v name="$name" '$2 == name { found=1 } END { exit !found }' encoders.txt || {
                  echo "${BUILD_ARCH} ${variant}: required encoder missing: $name" >&2
                  exit 1
                }
              done
              awk '$2 == "aac" { found=1 } END { exit !found }' decoders.txt || {
                echo 'Required AAC decoder missing' >&2
                exit 1
              }
              ./ffmpeg.exe -hide_banner -loglevel error -f lavfi \
                -i 'sine=frequency=1000:duration=0.25' -c:a aac -y smoke-aac.m4a
              ./ffmpeg.exe -hide_banner -loglevel error -i smoke-aac.m4a -f null -
              rm smoke-aac.m4a
              if [[ "$BUILD_ARCH" == x64 ]]; then
                ./ffmpeg.exe -hide_banner -loglevel error -f lavfi \
                  -i 'sine=frequency=1000:duration=0.25' -c:a libfdk_aac -y smoke-fdk.m4a
                ./ffmpeg.exe -hide_banner -loglevel error -i smoke-fdk.m4a -f null -
                rm smoke-fdk.m4a
              fi
              {
                printf 'architecture: %s\nvariant: %s\n' "$BUILD_ARCH" "$variant"
                for name in aac libfdk_aac libx264 libx265 libvpx-vp9 libaom-av1 libopus; do
                  if awk -v name="$name" '$2 == name { found=1 } END { exit !found }' encoders.txt; then
                    printf '%s: enabled\n' "$name"
                  else
                    printf '%s: unavailable\n' "$name"
                  fi
                done
                printf 'encoder count: %s\n' "$(awk '$1 ~ /^[VAS]/ { n++ } END { print n+0 }' encoders.txt)"
                printf 'decoder count: %s\n' "$(awk '$1 ~ /^[VAS]/ { n++ } END { print n+0 }' decoders.txt)"
              } > codec-audit.txt
              {
                printf 'FFmpeg library type: %s\n' "$variant"
                printf 'Executable bytes: %s\n' "$(du -cb *.exe | tail -1 | awk '{print $1}')"
                printf 'Bundled DLL bytes: %s\n' "$(find . -maxdepth 1 -iname '*.dll' -printf '%s\n' | awk '{n+=$1} END {print n+0}')"
                printf 'Bundled DLL count: %s\n' "$(find . -maxdepth 1 -iname '*.dll' | wc -l)"
                echo 'Static refers to FFmpeg libraries; external codecs may still require DLLs.'
              } > size-report.txt
            )
            cp LICENSE.md "$output/" 2>/dev/null || true
            cp COPYING.GPLv3 "$output/" 2>/dev/null || true
          done
          # Surface any codec difference between the two linking modes.
          {
            echo 'Encoders present in only one variant (static | shared):'
            comm -3 \
              <(awk '$1 ~ /^[VAS]/ {print $2}' dist-static/encoders.txt | sort -u) \
              <(awk '$1 ~ /^[VAS]/ {print $2}' dist-shared/encoders.txt | sort -u)
            echo 'Decoders present in only one variant (static | shared):'
            comm -3 \
              <(awk '$1 ~ /^[VAS]/ {print $2}' dist-static/decoders.txt | sort -u) \
              <(awk '$1 ~ /^[VAS]/ {print $2}' dist-shared/decoders.txt | sort -u)
          } > dist-shared/variant-differences.txt

      - uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-windows-${{ matrix.arch }}-static-${{ github.run_number }}
          path: dist-static/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-windows-${{ matrix.arch }}-shared-${{ github.run_number }}
          path: dist-shared/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-failure-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            dist/
            dist-static/
            dist-shared/
            build-static/ffbuild/config.log
            build-shared/ffbuild/config.log
          if-no-files-found: ignore
